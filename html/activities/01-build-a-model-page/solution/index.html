<!doctype html>
<html lang="en">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Model 3 page solution</title>

    <header>
      <nav aria-label="Main navigation">
        <a href="#features">Features</a> <a href="#specs">Specs</a>

        <ul>
          <li>Electric drive</li>
          <li>Five seats</li>

        <h2>Specs</h2>
        <p>Range: 321 miles</p>
      </section>
    </main>

</html>
