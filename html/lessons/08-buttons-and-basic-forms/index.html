<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>08-buttons-and-basic-forms</title>
    <style>
      body {
        font:
          1rem/1.5 Arial,
          sans-serif;
        color: #171a20;
        margin: 2rem;
      }
      button,
      a {
        cursor: pointer;
      }
      .card {
        background: #f4f4f4;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Choose a model</h1>
    <form>
      <label for="model">Model</label
      ><select id="model">
        <option>Model 3</option>
        <option>Model 3 Performance</option></select
      ><button type="button">Preview</button>
    </form>
  </body>
</html>
