<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>07-sections-and-articles</title>
    <style>
      body {
        font:
          1rem/1.5 Arial,
          sans-serif;
        color: #171a20;
        margin: 2rem;
      }
      button,
      a {
        cursor: pointer;
      }
      .card {
        background: #f4f4f4;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Model 3</h1>
      <section aria-labelledby="features">
        <h2 id="features">Features</h2>
        <article>
          <h3>Comfort</h3>
          <p>A quiet cabin.</p>
        </article>
      </section>
    </main>
  </body>
</html>
