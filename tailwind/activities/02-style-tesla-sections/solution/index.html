<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

<header class="flex items-center justify-between bg-slate-900 px-5 py-4 text-white"><strong>TESLA</strong><nav><a class="rounded hover:underline focus-visible:outline" href="#features">Features</a> <a class="ml-4 rounded hover:underline focus-visible:outline" href="#specs">Specs</a></nav></header>
