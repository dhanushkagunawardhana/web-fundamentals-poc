<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>05-functions</title>
    <script type="module">
      const output = document.querySelector("#output");
      function formatRange(miles) {
        return `${miles} mi`;
      }
      output.textContent = formatRange(321);
    </script>
  </head>
  <body>
    <main>
      <h1 id="title">Model 3</h1>
      <button id="action" type="button">Try it</button>
      <p id="output" aria-live="polite"></p>
    </main>
  </body>
</html>
