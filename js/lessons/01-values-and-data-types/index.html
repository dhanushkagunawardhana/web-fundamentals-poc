<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>01-values-and-data-types</title>
    <script type="module">
      const output = document.querySelector("#output");
      const model = "Model 3";
      const range = 321;
      const available = true;
      output.textContent = `${model}: ${range} miles; available: ${available}`;
    </script>
  </head>
  <body>
    <main>
      <h1 id="title">Model 3</h1>
      <button id="action" type="button">Try it</button>
      <p id="output" aria-live="polite"></p>
    </main>
  </body>
</html>
