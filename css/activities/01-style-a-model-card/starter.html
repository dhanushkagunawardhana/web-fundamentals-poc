<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Style a Model 3 card</title>
    <style>
      body {
        font-size: 16px;
        line-height: 24px;
        font-family: Arial, sans-serif;
        color: #171a20;
        margin: 32px;
      }
      button,
      a {
        cursor: pointer;
      }
      .card {
        background: #f4f4f4;
        padding: 16px;
      }
      /* TODO: Use selectors, typography, color, box model, spacing, and flexbox to style the starter card. */
    </style>
  </head>
  <body>
    <main>
      <h1>Model 3</h1>
      <p class="note">Electric sedan</p>
      <div class="card">Feature card</div>
      <div class="grid">
        <div>Range</div>
        <div>Seats</div>
      </div>
    </main>
  </body>
</html>
