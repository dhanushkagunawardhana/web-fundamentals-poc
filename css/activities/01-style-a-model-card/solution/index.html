<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Model card solution</title>
  <style>
body { margin: 0; font-family: Arial, sans-serif; font-size: 16px; line-height: 24px; color: #171a20; background: #f5f5f5; }
.page { max-width: 640px; margin: 40px auto; padding: 16px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
a { color: #315cc9; }
.card { margin-top: 24px; padding: 24px; border: 1px solid #ddd; border-radius: 8px; background: white; }
h1 { font-size: 32px; line-height: 40px; margin: 0; }
.note { color: #555; margin-top: 8px; }
</style>
</head>
<body>
<main class="page"><header class="row"><strong>TESLA</strong><nav><a href="#card">Model 3</a></nav></header>
<section id="card" class="card"><h1>Model 3</h1><p class="note">Electric sedan</p><div class="row"><span>321 mi range</span><span>5 seats</span></div></section></main>

</body>
</html>
