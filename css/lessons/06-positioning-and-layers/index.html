<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>06 Positioning and Layers</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Positioning and layers</h1>
      <section>
        <h2>Relative positioning</h2>
        <div class="relative-example">
          <span class="relative-box">Moved 20px down</span>
          <span>Next box stays in place</span>
        </div>
      </section>
      <section>
        <h2>Absolute positioning</h2>
        <div class="model-card">
          <span class="badge">New</span>
          <h3>Model 3</h3>
          <p>Electric sedan</p>
        </div>
      </section>
    </main>
  </body>
