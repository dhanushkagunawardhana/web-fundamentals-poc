<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>02 Colors and Typography</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 32px;
      }
      h1 {
        color: #171a20;
        font-size: 40px;
        font-weight: 700;
      }
      .intro {
        color: #555555;
        font-size: 20px;
        line-height: 30px;
      }
      .label {
        color: #2563eb;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .price {
        color: #047857;
        font-size: 28px;
        font-weight: 700;
      }
      .note {
        color: #6b7280;
        font-size: 14px;
        font-style: italic;
      }
      .highlight {
        color: #ffffff;
        background-color: #171a20;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Model 3</h1>
      <p class="intro">
        An electric sedan with room for five people and a quiet, comfortable
        ride.
      </p>
      <p class="label">Electric vehicle</p>
      <p class="price">321 miles of range</p>
      <p class="note">Range varies with driving conditions.</p>
      <p class="highlight">White text on a dark background</p>
    </main>
  </body>
</html>
