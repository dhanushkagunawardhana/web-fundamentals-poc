<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>05 Flexbox</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 32px;
      }
      .specs {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        min-height: 160px;
        padding: 16px;
        background: #f4f4f4;
      }
      .spec {
        padding: 16px;
        background: #cfe4ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Flexbox</h1>
      <div class="specs">
        <div class="spec">321 mi range</div>
        <div class="spec">5 seats</div>
        <div class="spec">Electric</div>
      </div>
    </main>
  </body>
</html>
