<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Style Tesla Sections with Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                100: "#dbeafe",
                200: "#bfdbfe",
              },
              secondary: {
                100: "#f3e8ff",
                200: "#e9d5ff",
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <header class="mx-auto flex max-w-5xl justify-between px-6 py-5">
      <strong class="font-bold tracking-widest">TESLA</strong>
      <a
        href="#specs"
        class="rounded hover:text-blue-700 focus-visible:outline focus-visible:outline-2"
      >
        Specs
      </a>
    </header>

    <main class="mx-auto max-w-5xl px-6 py-8">
      <section id="features">
        <a
          href="#specs"
          class="group block rounded-xl border border-secondary-200 bg-primary-100 p-6 transition hover:border-primary-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600"
        >
          <span class="rounded bg-primary-200 px-2 py-1 text-sm">Model 3</span>
          <h1 class="mt-4 text-3xl font-bold group-hover:text-blue-700">
            Ready for the road
          </h1>
          <p class="mt-2 text-slate-700">
            An electric sedan for everyday drives.
          </p>
        </a>
      </section>

      <section id="specs" class="mt-8">
        <h2 class="text-2xl font-bold">Quick specs</h2>
        <div class="mt-4 grid gap-4 sm:grid-cols-2">
          <article class="rounded-xl border border-secondary-200 bg-white p-5">
            <h3 class="text-sm text-slate-600">Range</h3>
            <p class="mt-2 text-2xl font-bold">321 mi</p>
          </article>
          <article class="rounded-xl border border-secondary-200 bg-white p-5">
            <h3 class="text-sm text-slate-600">Seating</h3>
            <p class="mt-2 text-2xl font-bold">5 adults</p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
