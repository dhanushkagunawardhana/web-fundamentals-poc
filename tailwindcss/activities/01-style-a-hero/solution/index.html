<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tailwind hero solution</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <main class="min-h-screen bg-slate-900 text-white">
      <section
        class="mx-auto flex max-w-4xl flex-col items-center px-5 py-24 text-center"
      >
        <p
          class="text-sm font-semibold uppercase tracking-widest text-slate-300"
        >
          Electric sedan
        </p>
        <h1 class="mt-4 text-5xl font-semibold">Model 3</h1>
        <p class="mt-5 max-w-xl text-lg text-slate-200">
          Meet a car made for everyday travel.
        </p>
        <div class="mt-8 flex gap-3">
          <a
            href="#details"
            class="rounded bg-blue-600 px-6 py-3 font-semibold text-white"
            >Explore</a
          ><a
            href="#details"
            class="rounded bg-white px-6 py-3 font-semibold text-slate-900"
            >Details</a
          >
        </div>
      </section>
      <section id="details" class="p-8 text-center">Model 3 details</section>
    </main>
  </body>
</html>
