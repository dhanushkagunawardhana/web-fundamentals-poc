<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Group and Peer Variants with Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="p-6">
    <main class="mx-auto max-w-sm">
      <div class="mt-4">
        <input id="select-card" type="checkbox" class="peer sr-only" />
        <label
          for="select-card"
          class="group block cursor-pointer rounded-xl border border-slate-200 bg-white p-5 transition peer-checked:border-blue-600 peer-checked:bg-blue-50 peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-blue-600"
        >
          <h2 class="font-semibold group-hover:text-blue-700">Feature card</h2>
          <p class="mt-1 text-sm text-slate-600">
            <code>group-hover</code> styles the title;
            <code>peer-checked</code> styles the card.
          </p>
        </label>
      </div>
    </main>
  </body>
</html>
