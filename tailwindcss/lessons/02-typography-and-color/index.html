<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>02-typography-and-color</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="p-8">
    <main>
      <h1 class="text-[40px] font-bold text-[#171a20]">Model 3</h1>
      <p class="text-xl leading-[30px] text-[#555555]">
        An electric sedan with room for five people and a quiet, comfortable
        ride.
      </p>
      <p class="text-sm font-bold tracking-[2px] text-blue-600 uppercase">
        Electric vehicle
      </p>
      <p class="text-[28px] font-bold text-emerald-700">321 miles of range</p>
      <p class="text-sm text-gray-500 italic">
        Range varies with driving conditions.
      </p>
      <p class="bg-[#171a20] p-3 text-white">
        White text on a dark background
      </p>
    </main>
  </body>
</html>
