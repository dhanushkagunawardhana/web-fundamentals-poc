<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spacing and Sizing with Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-white text-slate-900">
    <main class="mx-auto max-w-3xl px-5 py-16">
      <section
        class="mx-auto my-10 w-[90%] max-w-[400px] rounded-xl bg-slate-100 p-6"
        aria-labelledby="model-title"
      >
        <h1 id="model-title" class="text-2xl font-bold">Model 3</h1>
        <p class="mt-3 leading-6 text-slate-700">
          An electric sedan designed for everyday driving and longer trips.
        </p>
        <p class="mt-5 text-lg font-semibold text-slate-900">
          321 miles of range
        </p>
      </section>
    </main>
  </body>
</html>
