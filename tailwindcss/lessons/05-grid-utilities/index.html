<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grid Utilities with Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-5xl px-5 py-12">
      <h1 class="text-3xl font-bold">Model 3 specifications</h1>
      <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
        <article class="rounded-xl bg-white p-5 shadow-sm">
          <h2 class="text-sm font-medium text-slate-500">Range</h2>
          <p class="mt-3 text-2xl font-bold">321 mi</p>
        </article>
        <article class="rounded-xl bg-white p-5 shadow-sm">
          <h2 class="text-sm font-medium text-slate-500">Seating</h2>
          <p class="mt-3 text-2xl font-bold">5 adults</p>
        </article>
        <article class="rounded-xl bg-white p-5 shadow-sm">
          <h2 class="text-sm font-medium text-slate-500">Charging</h2>
          <p class="mt-3 text-2xl font-bold">Supercharger network</p>
        </article>
        <article class="rounded-xl bg-white p-5 shadow-sm">
          <h2 class="text-sm font-medium text-slate-500">Safety</h2>
          <p class="mt-3 text-2xl font-bold">5-star rating</p>
        </article>
      </div>
    </main>
  </body>
</html>
