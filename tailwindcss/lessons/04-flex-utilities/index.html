<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flex Utilities with Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-4xl px-5 py-8 sm:px-8 sm:py-12">
      <div
        id="specs"
        class="mt-8 flex min-h-40 flex-wrap items-stretch justify-between gap-4 rounded-2xl bg-slate-200 p-4 sm:p-5"
      >
        <article
          class="flex min-w-36 flex-1 flex-col justify-between gap-6 rounded-xl bg-white p-5"
        >
          <h2 class="text-sm font-medium text-slate-500">Range</h2>
          <p class="text-2xl font-bold">321 mi</p>
        </article>
        <article
          class="flex min-w-36 flex-1 flex-col justify-between gap-6 rounded-xl bg-white p-5"
        >
          <h2 class="text-sm font-medium text-slate-500">Seating</h2>
          <p class="text-2xl font-bold">5 adults</p>
        </article>
        <article
          class="flex min-w-36 flex-1 flex-col justify-between gap-6 rounded-xl bg-white p-5"
        >
          <h2 class="text-sm font-medium text-slate-500">Powertrain</h2>
          <p class="text-2xl font-bold">Electric</p>
        </article>
      </div>
    </main>
  </body>
</html>
